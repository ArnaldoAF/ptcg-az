<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Jogadores — Legends AZ</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./shared.js"></script>
    <script defer src="./jogadores.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <main class="appMain appMain--players" id="appMain" tabindex="-1">
        <section class="card card--players">
          <h1 class="card__title">Jogadores</h1>
          <p class="card__text">
            Cadastro simples de jogadores. Ao criar, só o nome é necessário (defaults: pontos 1000, vitórias 0, derrotas
            0).
          </p>

          <div class="spacer12"></div>
          <div class="playersLayout">
            <div id="playersList" class="playersLayout__list" aria-live="polite"></div>
            <div class="spacer12"></div>
            <div id="playersAdd"></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
