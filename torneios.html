<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Torneios — Legends AZ</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./shared.js"></script>
    <script defer src="./torneios.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <main class="appMain" id="appMain" tabindex="-1">
        <section class="card">
          <h1 class="card__title">Torneios</h1>
          <p class="card__text">
            Cadastre confrontos entre jogadores (cada confronto é um "round"). Um jogador não pode enfrentar o mesmo
            oponente duas vezes.
          </p>

          <div class="spacer12"></div>

          <div id="roundsList" aria-live="polite"></div>

          <div class="spacer12"></div>

          <div id="roundsForm"></div>
        </section>
      </main>
    </div>
  </body>
</html>
